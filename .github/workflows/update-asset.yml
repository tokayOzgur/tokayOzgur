name: Update Profile Asset

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "script/**"
      - ".github/workflows/update-asset.yml"

permissions:
  contents: write

concurrency:
  group: update-asset
  cancel-in-progress: true

jobs:
  update-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate asset
        env:
          # PROFILE_STATS_TOKEN (optional PAT, read:user + repo) also counts private contributions and repositories.
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
        run: node script/generate-asset.mjs

      - name: Commit changed asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset
          git diff --cached --quiet || { git commit -m "chore: refresh generated profile asset"; git push; }
