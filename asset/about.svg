<svg xmlns="http://www.w3.org/2000/svg" width="830" height="149" viewBox="0 0 830 149" role="img">
<title>About: I build reliable software across backend, frontend, and mobile. My core focus is designing maintainable systems with Java and Spring Boot, then pairing them with performant interfaces built in React, Next.js, React Native, and Expo.</title>
<defs>
<filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="830" height="149"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scanline" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity="0.045"/></pattern>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0420"/><stop offset="1" stop-color="#190838"/></linearGradient>
</defs>
<style>
.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Courier New',monospace}
.trace{stroke-dasharray:70 930;animation:trace 7s linear infinite}
.glitch{animation:glitch 5s steps(1,end) infinite}
.flicker{animation:flicker 6s steps(1,end) infinite}
.blink{animation:blink 1.1s steps(1,end) infinite}
@keyframes trace{to{stroke-dashoffset:-1000}}
@keyframes glitch{0%,90%,100%{transform:translate(0,0)}91%{transform:translate(-2px,1px)}93%{transform:translate(2px,-1px)}95%{transform:translate(-1px,0)}}
@keyframes flicker{0%,94%,100%{opacity:1}95%{opacity:.4}96%{opacity:1}97%{opacity:.55}98%{opacity:1}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<path d="M14,1 H829 V135 L816,148 H1 V14 Z" fill="url(#panel)"/>
<path d="M14,1 H829 V135 L816,148 H1 V14 Z" fill="url(#scanline)"/>
<path d="M14,1 H829 V135 L816,148 H1 V14 Z" fill="none" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1.2"/>
<path class="trace" d="M14,1 H829 V135 L816,148 H1 V14 Z" pathLength="1000" fill="none" stroke="#00f0ff" stroke-width="2.4" filter="url(#glow)"/>
<text class="mono" x="24" y="31" font-size="12" fill="#e9e4ff">I build reliable software across backend, frontend, and mobile. My core focus is designing maintainable</text>
<text class="mono" x="24" y="49" font-size="12" fill="#e9e4ff">systems with Java and Spring Boot, then pairing them with performant interfaces built in React, Next.js,</text>
<text class="mono" x="24" y="67" font-size="12" fill="#e9e4ff">React Native, and Expo.</text>
<text class="mono" x="24" y="93" font-size="12" font-weight="700" fill="#00f0ff">▸</text>
<text class="mono" x="40" y="93" font-size="12" fill="#e9e4ff">Building backend architectures with Java, Spring Boot, JOOQ, and SQL-first thinking</text>
<text class="mono" x="24" y="111" font-size="12" font-weight="700" fill="#ff2a6d">▸</text>
<text class="mono" x="40" y="111" font-size="12" fill="#e9e4ff">Creating responsive product experiences with React.js, Next.js, React Native, and Expo</text>
<text class="mono" x="24" y="129" font-size="12" font-weight="700" fill="#f9f002">▸</text>
<text class="mono" x="40" y="129" font-size="12" fill="#e9e4ff">Working with clean architecture, code quality, performance, and long-term maintainability</text>
</svg>
